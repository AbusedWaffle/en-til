<!DOCTYPE html>
<html lang="da"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Flip 7">
<meta name="theme-color" content="#10192e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Flip 7 online</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:#10192e;color:#fff;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);overscroll-behavior:none;-webkit-user-select:none;user-select:none}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:560px;margin:auto}
h1{margin:0;font-size:22px;letter-spacing:1px;flex:1}h1 span{color:#ffcf40}
.pill{font-size:12px;padding:5px 10px;border-radius:20px;background:#1b2a4a;color:#9fb0d0;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:#6b7a99;display:inline-block;flex:none}
.dot.on{background:#3ddc84}.dot.wait{background:#ffcf40}.dot.off{background:#e0485f}
main{padding:0 12px calc(110px + env(safe-area-inset-bottom));max-width:560px;margin:auto}
.card{background:#1b2a4a;border-radius:16px;padding:14px;margin-bottom:12px}
input,button{font:inherit}
input[type=text],input[type=number]{width:100%;padding:13px;border-radius:10px;border:0;background:#0d1628;color:#fff;font-size:18px;-webkit-user-select:text;user-select:text}
#code{text-transform:uppercase;letter-spacing:6px;font-weight:800;text-align:center;font-size:24px}
button{border:0;border-radius:12px;padding:14px 16px;font-size:17px;font-weight:700;cursor:pointer;touch-action:manipulation}
button:disabled{opacity:.35}
.primary{background:#ffcf40;color:#10192e;width:100%}
.ghost{background:#2b3d63;color:#fff}
.danger{background:#5a2330;color:#ffb3c0}
.lbl{font-size:13px;color:#9fb0d0;margin:10px 0 5px}
.hint{color:#9fb0d0;font-size:13px;line-height:1.45}
.err{background:#5a2330;color:#ffd0d8;border-radius:12px;padding:12px;margin-bottom:12px;font-size:15px}
.roomcode{font-size:44px;font-weight:900;letter-spacing:10px;color:#ffcf40;text-align:center;margin:4px 0}
.qr{background:#fff;border-radius:14px;padding:10px;width:210px;height:210px;margin:10px auto}
.qr svg{width:100%;height:100%;display:block}
.link{word-break:break-all;text-align:center;font-size:12px;color:#9fb0d0}
.plist .pl{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:#22345a;margin-bottom:7px;font-size:17px;font-weight:600}
.pl .grow{flex:1}
.x{background:#10192e;color:#9fb0d0;padding:6px 11px;font-size:14px}
/* spil */
.banner{position:sticky;top:0;z-index:5;margin:0 -12px 12px;padding:14px 16px;text-align:center;font-size:20px;font-weight:800;background:#22345a;color:#cfd9ee;border-bottom:1px solid #10192e}
.banner.me{background:#ffcf40;color:#10192e;font-size:30px;animation:pulse 1.2s infinite}
.banner.bad{background:#5a2330;color:#ffd0d8}
.banner small{display:block;font-size:13px;font-weight:600;opacity:.8;margin-top:2px}
@keyframes pulse{0%{box-shadow:0 0 0 0 #ffcf40cc}70%{box-shadow:0 0 0 16px #ffcf4000}100%{box-shadow:0 0 0 0 #ffcf4000}}
.sub{color:#9fb0d0;font-size:13px;text-align:center;margin:-4px 0 10px}
.mine{position:relative}
.mine.turn{outline:3px solid #ffcf40}
.mhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.mhead .pts{font-size:40px;font-weight:900;color:#ffcf40;line-height:1}
.mhead .pts small{font-size:15px;color:#9fb0d0;font-weight:600}
.hand{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px;min-height:76px}
.row2{display:flex;flex-wrap:wrap;gap:7px;margin-top:7px}
.c{display:inline-flex;flex-direction:column;width:50px;height:72px;border-radius:9px;align-items:center;justify-content:center;font-weight:900;font-size:28px;background:#f6f1e3;color:#10192e;box-shadow:0 2px 0 #0006;line-height:1;text-align:center}
.c i{font-style:normal;font-size:10px;font-weight:800;margin-top:3px;letter-spacing:.2px}
.c.mod{background:#ff8a3d;color:#fff;font-size:22px}
.c.fr{background:#7fd8ff;color:#0b3550;font-size:24px}
.c.f3{background:#ffcf40;color:#10192e;font-size:24px}
.c.sc{background:#e0485f;color:#fff;font-size:24px}
.c.dup{outline:3px solid #e0485f;background:#ffd6dc;color:#b0102a}
.c.pop{animation:pop .45s ease-out}
@keyframes pop{0%{transform:scale(.3) rotate(-12deg);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.sm .c{width:24px;height:33px;font-size:14px;border-radius:5px;box-shadow:none}
.sm .c.mod{font-size:11px}.sm .c.fr,.sm .c.f3,.sm .c.sc{font-size:12px}
.sm .c i{display:none}
.sm{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.n0{color:#555}.n1{color:#8a6d3b}.n2{color:#2e8b57}.n3{color:#c0392b}.n4{color:#2471a3}.n5{color:#16a085}.n6{color:#8e44ad}.n7{color:#d35400}.n8{color:#27ae60}.n9{color:#b7950b}.n10{color:#c2185b}.n11{color:#1a5276}.n12{color:#6c3483}
.status{font-size:12px;font-weight:800;padding:4px 9px;border-radius:20px;background:#10192e;color:#9fb0d0;white-space:nowrap}
.st-active{background:#1e4d3a;color:#8ff0c0}.st-stopped{background:#2b3d63;color:#cfe0ff}.st-bust{background:#e0485f;color:#fff}.st-frozen{background:#7fd8ff;color:#0b3550}.st-flip7{background:#ffcf40;color:#10192e}
.pr{padding:10px 12px;border-radius:14px;background:#22345a;margin-bottom:8px;border:2px solid transparent}
.pr.cur{border-color:#ffcf40;background:#3a3212}
.pr .top{display:flex;align-items:center;gap:8px}
.pr .nm{flex:1;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .nm small{font-weight:500;color:#9fb0d0;font-size:12px;margin-left:4px}
.pr .rp{font-size:13px;color:#9fb0d0;min-width:42px;text-align:right}
.pr .tot{font-size:22px;font-weight:900;min-width:44px;text-align:right}
.rank{width:24px;height:24px;border-radius:50%;background:#10192e;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;flex:none}
.rank.lead{background:#ffcf40;color:#10192e}
.log div{padding:5px 0;border-bottom:1px solid #22345a;font-size:14px;color:#cfd9ee}
.log div:first-child{color:#fff;font-weight:700}
.log .bust{color:#ff9aab}.log .flip7{color:#ffcf40}.log .action{color:#9fe3ff}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#10192ef5;display:flex;gap:10px;max-width:560px;margin:auto}
.bottom button{flex:1;height:68px;font-size:22px}
.bottom .draw{background:#ffcf40;color:#10192e;flex:1.4}
.bottom .stop{background:#3ddc84;color:#0b2a1a}
.bottom.go .draw{animation:pulse 1.2s infinite}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:#1b2a4a;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 6px;font-size:24px}
.pick button{display:flex;width:100%;justify-content:space-between;align-items:center;margin-bottom:8px;background:#22345a;color:#fff;font-size:19px;padding:16px}
.pick button b{color:#ffcf40}
table{width:100%;border-collapse:collapse;font-size:16px;margin:8px 0 12px}
th,td{padding:8px 4px;text-align:left;border-bottom:1px solid #2b3d63}
th{color:#9fb0d0;font-weight:500;font-size:13px}
td.n{text-align:right;font-weight:800}
.win{text-align:center;padding:18px;background:linear-gradient(135deg,#ffcf40,#ff8a3d);color:#10192e;border-radius:16px;margin-bottom:12px;font-size:24px;font-weight:900}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 100px);transform:translateX(-50%) translateY(20px);background:#fff;color:#10192e;font-weight:800;padding:12px 18px;border-radius:14px;box-shadow:0 6px 24px #0008;z-index:30;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-size:16px}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.bust{background:#e0485f;color:#fff}#toast.flip7{background:#ffcf40}#toast.action{background:#7fd8ff}
.overlay{position:fixed;inset:0;background:#10192ef0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
.overlay .box{max-width:360px}
.spin{width:38px;height:38px;border:4px solid #2b3d63;border-top-color:#ffcf40;border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.hostfix{background:#3a2a12;border-radius:12px;padding:10px;margin-bottom:12px;font-size:14px}
.hostfix button{margin-top:8px;width:100%}
/* ---------- animationer ---------- */
.c.flipin{animation:flipin .55s cubic-bezier(.2,.9,.3,1.15) both}
.c.glow{animation:flipin .55s cubic-bezier(.2,.9,.3,1.15) both,glowc 1.2s .5s ease-out}
@keyframes flipin{0%{transform:perspective(500px) translateY(-26px) rotateY(180deg) scale(.7);opacity:0;background:#3b5b9a;color:transparent;box-shadow:0 0 0 #0000}
50%{transform:perspective(500px) translateY(-8px) rotateY(90deg) scale(.95);opacity:1;background:#3b5b9a;color:transparent}
100%{transform:none;opacity:1}}
@keyframes glowc{0%{box-shadow:0 0 0 0 #ffcf40ff}50%{box-shadow:0 0 18px 6px #ffcf40cc}100%{box-shadow:0 2px 0 #0006}}
.c.crack{animation:flipin .45s both,cshake .5s .45s}
@keyframes cshake{0%,100%{transform:none}20%{transform:translateX(-5px) rotate(-6deg)}40%{transform:translateX(5px) rotate(5deg)}60%{transform:translateX(-4px) rotate(-3deg)}80%{transform:translateX(3px)}}
#app.shake{animation:shake .5s}
@keyframes shake{0%,100%{transform:none}15%{transform:translate(-9px,3px)}30%{transform:translate(8px,-4px)}45%{transform:translate(-7px,2px)}60%{transform:translate(6px,-2px)}75%{transform:translate(-3px,1px)}}
.pr,.mine{position:relative}
.pr.is-bust{background:linear-gradient(135deg,#4a1a28,#2a1d33);border-color:#e0485f55}
.pr.is-bust .sm{opacity:.55;filter:grayscale(.5)}
.pr.is-frozen,.mine.is-frozen{background:linear-gradient(135deg,#1d5878,#22345a 70%);border-color:#7fd8ff88;overflow:hidden}
.pr.is-frozen::after,.mine.is-frozen::after{content:'❄';position:absolute;right:-6px;bottom:-22px;font-size:74px;color:#dff6ff;opacity:.13;pointer-events:none}
.mine.is-bust{background:linear-gradient(135deg,#4a1a28,#1b2a4a 70%)}
.fx-shake{animation:shake .5s,flashr 1s}
@keyframes flashr{0%{box-shadow:inset 0 0 0 60px #e0485fdd,0 0 0 0 #e0485f}100%{box-shadow:inset 0 0 0 0 #e0485f00,0 0 0 14px #e0485f00}}
.fx-ice{animation:ice 1.2s}
@keyframes ice{0%{box-shadow:inset 0 0 0 40px #e6f7ffcc}100%{box-shadow:inset 0 0 0 0 #e6f7ff00}}
.fx-glow{animation:glowr 1.2s}
@keyframes glowr{0%{box-shadow:0 0 0 0 #ff6b86}40%{box-shadow:0 0 16px 4px #ff6b86}100%{box-shadow:0 0 0 0 #ff6b8600}}
.fx-stop{animation:stopr 1s}
@keyframes stopr{0%{box-shadow:0 0 0 0 #3ddc84aa}100%{box-shadow:0 0 0 14px #3ddc8400}}
.fx-gold{animation:goldr 1.4s}
@keyframes goldr{0%,60%{box-shadow:0 0 22px 6px #ffcf40}100%{box-shadow:0 0 0 0 #ffcf4000}}
.floaty{position:absolute;right:16px;bottom:8px;z-index:3;font-weight:900;font-size:22px;color:#ffcf40;text-shadow:0 2px 0 #0008;pointer-events:none;animation:floaty 1.5s ease-out both;white-space:nowrap}
.floaty.stop{color:#8ff0c0;font-size:17px}
@keyframes floaty{0%{transform:translateY(12px) scale(.5);opacity:0}20%{transform:translateY(0) scale(1.15);opacity:1}70%{opacity:1}100%{transform:translateY(-26px);opacity:0}}
.fxrows tr{animation:rowin .45s both}
.fxrows tr:nth-child(2){animation-delay:.1s}.fxrows tr:nth-child(3){animation-delay:.2s}.fxrows tr:nth-child(4){animation-delay:.3s}.fxrows tr:nth-child(5){animation-delay:.4s}.fxrows tr:nth-child(6){animation-delay:.5s}.fxrows tr:nth-child(7){animation-delay:.6s}.fxrows tr:nth-child(8){animation-delay:.7s}.fxrows tr:nth-child(9){animation-delay:.8s}
@keyframes rowin{0%{transform:translateX(-30px);opacity:0}100%{transform:none;opacity:1}}
/* overlay */
#fx{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:20px;cursor:pointer;transition:opacity .18s}
#fx.show{display:flex;animation:fxin .2s ease-out}
#fx.out{opacity:0}
@keyframes fxin{from{opacity:0}to{opacity:1}}
#fx .fxb{position:relative;z-index:2;max-width:380px;width:100%}
#fx .ttl{font-size:clamp(52px,17vw,84px);font-weight:900;line-height:1;letter-spacing:1px;animation:slam .5s cubic-bezier(.2,1.4,.4,1) both}
#fx .who{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin:14px 0 4px;animation:up .4s .25s both}
#fx .who b{background:#ffffff26;padding:7px 13px;border-radius:12px;font-size:19px;max-width:40vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fx .who .ar{font-size:24px;animation:arr .7s .5s infinite alternate}
@keyframes arr{to{transform:translateX(6px)}}
#fx .sub{font-size:26px;font-weight:900;margin:14px 0 0;color:#fff;animation:up .4s .2s both;text-shadow:0 2px 8px #0008}
#fx .sm2{font-size:16px;font-weight:700;margin-top:8px;opacity:.9;animation:up .4s .35s both}
#fx .tap{position:absolute;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));font-size:12px;opacity:.6;z-index:2;color:#fff}
#fx .bar{position:absolute;left:0;bottom:0;height:5px;background:#fff9;z-index:2;animation:bar var(--dur) linear both}
@keyframes bar{from{width:100%}to{width:0}}
@keyframes slam{0%{transform:scale(2.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes up{0%{transform:translateY(16px);opacity:0}100%{transform:none;opacity:1}}
#fx .vis{height:150px;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px;position:relative}
.c.big{width:78px;height:112px;font-size:50px;border-radius:12px;box-shadow:0 6px 18px #0009}
.c.big i{font-size:12px}
.c.big.mod{font-size:34px}.c.big.fr,.c.big.f3,.c.big.sc{font-size:40px}
/* BUST */
#fx.bust{background:radial-gradient(circle at 50% 45%,#e0485ff4,#5a0f1ffa 60%,#10192efc);color:#fff;animation:fxin .15s,redflash .6s}
@keyframes redflash{0%{background-color:#fff}15%{background-color:#ff2d4d}}
.crk{position:relative;display:inline-block;color:transparent}
.crk::before,.crk::after{content:attr(data-t);position:absolute;left:0;top:0;right:0;color:#fff;text-shadow:0 5px 0 #7a0f22,0 0 30px #ff2d4d}
.crk::before{-webkit-clip-path:polygon(0 0,100% 0,100% 44%,78% 56%,58% 40%,38% 60%,18% 44%,0 56%);clip-path:polygon(0 0,100% 0,100% 44%,78% 56%,58% 40%,38% 60%,18% 44%,0 56%);animation:crkT .6s .55s both}
.crk::after{-webkit-clip-path:polygon(0 56%,18% 44%,38% 60%,58% 40%,78% 56%,100% 44%,100% 100%,0 100%);clip-path:polygon(0 56%,18% 44%,38% 60%,58% 40%,78% 56%,100% 44%,100% 100%,0 100%);animation:crkB .6s .55s both}
@keyframes crkT{to{transform:translate(-5px,-7px) rotate(-4deg)}}
@keyframes crkB{to{transform:translate(6px,8px) rotate(3deg)}}
.split{position:relative;width:78px;height:112px;animation:slam .35s both}
.split .c{position:absolute;inset:0;outline:4px solid #e0485f;background:#ffd6dc;color:#b0102a}
.split .h1{-webkit-clip-path:polygon(0 0,56% 0,44% 30%,62% 52%,42% 76%,54% 100%,0 100%);clip-path:polygon(0 0,56% 0,44% 30%,62% 52%,42% 76%,54% 100%,0 100%);animation:hl .55s .5s both}
.split .h2{-webkit-clip-path:polygon(56% 0,100% 0,100% 100%,54% 100%,42% 76%,62% 52%,44% 30%);clip-path:polygon(56% 0,100% 0,100% 100%,54% 100%,42% 76%,62% 52%,44% 30%);animation:hr .55s .5s both}
@keyframes hl{to{transform:translate(-16px,6px) rotate(-14deg)}}
@keyframes hr{to{transform:translate(16px,10px) rotate(15deg)}}
.bolt{position:absolute;font-size:44px;animation:up .3s .5s both}
/* FRYS */
#fx.freeze{background:radial-gradient(ellipse at 50% 45%,#14395af8 25%,#3aa4d8f5 75%,#dff6fff8);color:#fff}
#fx.freeze::before{content:'';position:absolute;inset:0;box-shadow:inset 0 0 90px 40px #f2fbff;animation:frost 1s ease-out both;pointer-events:none}
@keyframes frost{from{opacity:0;transform:scale(1.2)}to{opacity:1;transform:none}}
#fx.freeze .ttl{color:#e9f9ff;text-shadow:0 4px 0 #1b6d98,0 0 26px #bdeeff}
.ice{font-size:110px;line-height:1;color:#effbff;text-shadow:0 0 30px #bdeeff,0 0 8px #fff;animation:icein .8s cubic-bezier(.2,1.3,.4,1) both}
@keyframes icein{0%{transform:rotate(-200deg) scale(0);opacity:0}100%{transform:none;opacity:1}}
.flake{position:absolute;top:-40px;left:var(--x);font-size:var(--s);color:#fff;opacity:.9;animation:fall var(--d) var(--dl) linear both;z-index:1;pointer-events:none}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--sx),110vh) rotate(360deg)}}
/* FLIP 3 */
#fx.flip3{background:radial-gradient(circle at 50% 45%,#6b4f00f6,#10192efc 70%);color:#fff}
#fx.flip3 .ttl{color:#ffcf40;text-shadow:0 4px 0 #7a5a00,0 0 24px #ffcf4088}
#fx.flip3 .c.big{animation:flipin .5s cubic-bezier(.2,.9,.3,1.15) both}
.c.big.dup{outline:4px solid #e0485f;background:#ffd6dc;color:#b0102a}
.c.big.saved{outline:4px solid #8ff0c0}
/* 2. chance / reddet */
#fx.sc,#fx.save{background:radial-gradient(circle at 50% 45%,#8a1f3af6,#10192efc 70%);color:#fff}
#fx.sc .ttl,#fx.save .ttl{color:#fff;text-shadow:0 4px 0 #7a0f22,0 0 26px #ff6b86}
.shield{width:120px;height:120px;border-radius:50% 50% 50% 50%/40% 40% 60% 60%;background:radial-gradient(circle at 50% 35%,#ff8aa0,#e0485f 60%,#9b1330);display:flex;align-items:center;justify-content:center;font-size:64px;color:#fff;box-shadow:0 0 0 6px #ffffff33,0 0 40px 10px #ff6b8699;animation:icein .7s cubic-bezier(.2,1.3,.4,1) both,shglow 1s .7s ease-in-out infinite alternate}
@keyframes shglow{to{box-shadow:0 0 0 10px #ffffff22,0 0 60px 20px #ff6b86cc}}
.shwrap{position:relative;width:120px;height:120px}
.shwrap .shield{position:absolute;inset:0;animation:none;box-shadow:none}
.shwrap{filter:drop-shadow(0 0 18px #ff6b86aa)}
.shwrap .s1{-webkit-clip-path:polygon(0 0,55% 0,45% 30%,60% 55%,42% 100%,0 100%);clip-path:polygon(0 0,55% 0,45% 30%,60% 55%,42% 100%,0 100%);animation:sh1 .6s .55s both}
.shwrap .s2{-webkit-clip-path:polygon(55% 0,100% 0,100% 100%,42% 100%,60% 55%,45% 30%);clip-path:polygon(55% 0,100% 0,100% 100%,42% 100%,60% 55%,45% 30%);animation:sh2 .6s .55s both}
@keyframes sh1{to{transform:translate(-14px,10px) rotate(-14deg);opacity:.55}}
@keyframes sh2{to{transform:translate(14px,12px) rotate(12deg);opacity:.55}}
.gone{animation:slam .35s both,gone .6s .9s both}
@keyframes gone{to{transform:translate(70px,-50px) rotate(35deg) scale(.6);opacity:0}}
.xmark{position:absolute;right:-16px;top:-22px;font-size:46px;color:#e0485f;font-weight:900;text-shadow:0 2px 0 #fff;animation:up .25s .45s both}
/* FLIP 7 + vinder */
#fx.flip7,#fx.win{background:radial-gradient(circle at 50% 45%,#ffd84f,#ff8a3d 50%,#10192e 95%);color:#10192e}
#fx.flip7 .ttl,#fx.win .ttl{color:#fff;text-shadow:0 5px 0 #b35a00,0 0 30px #fff6}
#fx.flip7 .sub,#fx.win .sub{color:#fff}

<header><h1>FLIP <span>7</span></h1><div class="pill" id="pill"><span class="dot"></span>Offline</div></header>

<script>
'use strict';
const G = window.Flip7;
const $ = id => document.getElementById(id);

const PEER_KEYS = ['peerhost', 'peerport', 'peerpath', 'peersecure'];

const STATUS = { active: 'Aktiv', stopped: 'Stoppet', bust: 'Bust', frozen: 'Frosset' };
const CARD_NAME = { fr: 'Frys', f3: 'Flip 3', sc: '2. chance' };
const CARD_DESC = { fr: 'Spilleren banker sine point og er ude af runden.', f3: 'Spilleren skal vende de næste 3 kort ét ad gangen.', sc: 'Du har allerede en 2. chance – giv denne til en anden aktiv spiller.' };

// ---------- tilstand ----------
let role = null, room = null, peer = null, S = null, view = null, conns = {}, hostConn = null;

// ---------- lyd / vibration / wakelock ----------

// ---------- toast ----------
let toastT = null;

// ---------- VÆRT ----------
function saveHost() { if (S && room) LS.set('host-' + room, S); }

  S = G.createLobby(target); G.addPlayer(S, myId, name);
  LS.set('session', { room, role: 'host' }); saveHost();
  startHostPeer(); publish();
}
function resumeHost(code) {
  role = 'host'; room = code; freshHost = false;
  S = LS.get('host-' + code);

  startHostPeer(); publish();
}
function startHostPeer() {
  if (peer) try { peer.destroy(); } catch (e) {}

  const pr = peer = new Peer('flip7-' + room, peerOpts());
  pr.on('open', () => {
    if (pr !== peer) return;
    connState = 'online'; errMsg = ''; freshHost = false;

}

}

  if (role !== 'host') return;

function hostAct(a) {

  else { if (!hostConn || !hostConn.open) return toast('Ingen forbindelse til værten'); send(hostConn, { t: 'intent', a: a.a, target: a.target }); sending = true; render(); }
}
function hostActFor(pid, a) { if (role !== 'host') return; const r = G.act(S, pid, a); if (!r.ok) toast(r.err); publish(); }

// ---------- KLIENT ----------
function clientJoin(code, name) {

  const lost = () => { if (hostConn !== c) return; clearTimeout(to); hostConn = null; if (rejected) return; connState = 'lost'; errMsg = errMsg || 'Forbindelsen til værten er tabt. Prøver igen…'; render(); scheduleReconnect(); };

}
function onClientData(d) {
  if (!d || typeof d !== 'object') return;
  lastMsg = Date.now();
  if (d.t === 'state') { view = d.s; sending = false; render(); }
  else if (d.t === 'ping') send(hostConn, { t: 'pong' });
  else if (d.t === 'err') { sending = false; toast(d.msg); render(); }

  if (role === 'client' && connState === 'online' && Date.now() - lastMsg > 10000) {
    const c = hostConn; hostConn = null; try { c && c.close(); } catch (e) {}
    connState = 'lost'; errMsg = 'Intet svar fra værten. Prøver igen…'; render(); scheduleReconnect(500);
  }

  if (document.visibilityState !== 'visible') return;
  if (view && view.phase !== 'lobby') keepAwake();
  if (role === 'client' && connState !== 'online') { clearTimeout(reconnTimer); reconnTimer = null; scheduleReconnect(100); }
  if (role === 'host' && peer && !peer.destroyed && peer.disconnected) try { peer.reconnect(); } catch (e) {}

  if (!confirm(msg)) return;
  if (role === 'host') { Object.values(conns).forEach(c => send(c, { t: 'reject', reason: 'Værten har afsluttet spillet.' })); LS.del('host-' + room); }
  LS.del('session');
  setTimeout(() => { try { peer && peer.destroy(); } catch (e) {} location.href = location.pathname + '?' + new URLSearchParams([...qs].filter(([k]) => PEER_KEYS.includes(k))).toString(); }, 300);

// ---------- animationer (hændelser fra værten: view.events med stigende id) ----------
const RM = window.matchMedia ? matchMedia('(prefers-reduced-motion: reduce)') : { matches: false };
const FX_BIG = { bust: 1, freeze: 1, flip3: 1, save: 1, sc: 1, flip7: 1, win: 1 };
let fxBig = false, fxQ = [], fxCur = null, fxTimer = null, fxOutT = null;
// Nye hændelser siden sidst. Første visning (join, genindlæsning, genforbindelse) springer gamle hændelser over.

const SFX = {

  flip7: () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, k * 0.09, 0.3, 'triangle', 0.07)),

const VIB_ME = { bust: [60, 40, 60, 40, 260], freeze: [30, 60, 30, 60, 30], flip3: [40, 400, 40, 400, 40], save: [40, 60, 120], sc: [40, 60, 40], flip7: [100, 50, 100, 50, 300], win: [100, 50, 100, 50, 300] };
function fxEsc(v, i, subj) { const meIdx = v.players.findIndex(p => p.id === myId); return i === meIdx ? (subj ? 'Du' : 'dig') : esc((v.players[i] || {}).name || '?'); }

      <div class="sub">${e.p === e.t ? `${Su(e.t)} fik en 2. chance` : `${Su(e.p)} gav ${P(e.t)} en 2. chance`}</div><div class="sm2">Redder én gang fra bust</div>` };

function fxPush(o) {

}
function fxNext() {

  fxCur = o; $('toast').className = '';
  const r = fxHtml(o, o.v);

  buzz(mine || o.e.type === 'win' ? VIB_ME[o.e.type] : 30);
  if (SFX[o.e.type]) SFX[o.e.type]();
  if (o.e.type === 'bust' && !RM.matches) { const a = $('app'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake'); setTimeout(() => a.classList.remove('shake'), 600); }

$('fx').addEventListener('click', fxDone);
function fxRow(i) { return document.querySelector(`.pr[data-p="${i}"]`); }
function fxAddCls(el, cls, delay) { if (!el) return; if (delay) el.style.animationDelay = delay + 'ms'; el.classList.add(cls); }
function fxCard(scope, card, cls, delay, dup) {

function fxFloat(el, txt, cls) { if (!el) return; const f = document.createElement('div'); f.className = 'floaty ' + (cls || ''); f.textContent = txt; el.appendChild(f); }
// Afspil hændelser: små effekter direkte på kort/rækker, store som overlay i kø
function playEvents(fresh, v) {
  const meIdx = v.players.findIndex(p => p.id === myId);
  let stagger = 0;
  fresh.forEach((e, k) => {
    const row = fxRow(e.p), mineEl = e.p === meIdx ? $('mine') : null;
    const d = e.deal ? stagger++ * 140 : 0;
    if (e.type === 'card') {
      const mod = e.card[0] === 'm' || e.card === 'x2';
      [row, mineEl].forEach(sc => fxCard(sc, e.card, mod ? 'glow' : 'flipin', d));
      if (mod) { fxFloat(row, G.label(e.card)); fxFloat(mineEl, G.label(e.card)); fxAddCls(row, 'fx-gold'); }
    } else if (e.type === 'bust') {
      [row, mineEl].forEach(sc => fxCard(sc, e.card, 'crack', 0, true)); fxAddCls(row, 'fx-shake'); fxAddCls(mineEl, 'fx-shake');
    } else if (e.type === 'stop') {

    } else if (e.type === 'freeze') {

      const t = e.type === 'sc' ? e.t : e.p; fxAddCls(fxRow(t), 'fx-glow'); if (t === meIdx) fxAddCls($('mine'), 'fx-glow');
    } else if (e.type === 'flip7') {
      fxAddCls(row, 'fx-gold'); fxAddCls(mineEl, 'fx-gold');
    } else if (e.type === 'roundEnd') {
      const t = $('summary'); if (t) t.classList.add('fxrows');
    }
    if (FX_BIG[e.type]) {
      const o = { e, v };
      if (e.type === 'flip3') o.cards = fresh.slice(k + 1).filter(x => x.f3 && x.p === e.t && (x.type === 'card' || x.type === 'bust' || x.type === 'save')).slice(0, 3);

}

// ---------- visning ----------
function cardHtml(c, extra) {
  let cls = 'c', inner;
  if (c[0] === 'n') { cls += ' n' + c.slice(1); inner = c.slice(1); }
  else if (c[0] === 'm' || c === 'x2') { cls += ' mod'; inner = G.label(c); }
  else { cls += ' ' + c; inner = { fr: '❄', f3: '3', sc: '♥' }[c] + '<i>' + CARD_NAME[c].toUpperCase() + '</i>'; }
  return `<span class="${cls} ${extra || ''}" data-c="${c}">${inner}</span>`;
}
function handHtml(p, big) {
  const nums = p.nums.map(v => cardHtml('n' + v));
  if (p.bustCard !== null && p.bustCard !== undefined) nums.push(cardHtml('n' + p.bustCard, 'dup'));
  const other = p.mods.map(c => cardHtml(c)).concat(p.acts.map(c => cardHtml(c)));
  if (!big) return nums.concat(other).join('');

}
function statusChip(p) { return p.flip7 ? '<span class="status st-flip7">FLIP 7!</span>' : `<span class="status st-${p.status}">${STATUS[p.status]}</span>`; }
function me() { return view && view.players.find(p => p.id === myId); }
function isMyTurn(v) {
  if (!v || v.phase !== 'play') return false;
  const i = v.players.findIndex(p => p.id === myId);
  if (v.pending) return v.pending.chooser === i;
  return v.stage === 'turns' && v.turn === i;
}
function setPill() {
  const map = { online: ['on', role === 'host' ? 'Vært · online' : 'Forbundet'], connecting: ['wait', 'Forbinder…'], lost: ['off', 'Afbrudt'], offline: ['', 'Offline'] };
  const [cls, txt] = map[connState] || map.offline;
  $('pill').innerHTML = `<span class="dot ${cls}"></span>${esc(txt)}${room ? ' · ' + esc(room) : ''}`;
}
function keepInput(fn) {
  const a = document.activeElement, id = a && a.id, val = a && a.value, ss = a && a.selectionStart;
  fn();
  if (id && $(id)) { const e = $(id); if (e.value !== val) e.value = val; e.focus(); try { e.setSelectionRange(ss, ss); } catch (x) {} }
}
function render() {
  setPill();
  const ov = $('ov');
  if (role === 'client' && !rejected && view && connState !== 'online') {
    ov.innerHTML = `<div class="overlay"><div class="box"><div class="spin"></div><h2>Forbindelsen til værten er tabt</h2><p class="hint">${esc(errMsg || 'Prøver at genoprette forbindelsen…')}</p><p class="hint">Du kommer automatisk tilbage i spillet med dine kort, når forbindelsen er genoprettet.</p><button class="ghost" onclick="leave()">Forlad spillet</button></div></div>`;
  } else ov.innerHTML = '';
  if (!role || rejected) return renderHome();
  if (!view) return renderConnecting();
  const fresh = takeEvents(view);
  if (view.phase === 'lobby') return renderLobby();
  fxBig = fresh.some(e => FX_BIG[e.type]);
  renderGame();
  if (fresh.length) playEvents(fresh, view);
}
function renderConnecting() {
  $('bottom').style.display = 'none'; $('modal').classList.remove('show');
  $('app').innerHTML = `<div class="card" style="text-align:center;margin-top:30px"><div class="spin"></div><h2 style="margin:0 0 6px">Forbinder til spil ${esc(room)}…</h2>${errMsg ? `<div class="err" style="margin-top:12px">${esc(errMsg)}</div>` : ''}<button class="ghost" onclick="leave()">Annuller</button></div>`;
}
function renderHome() {
  $('bottom').style.display = 'none'; $('modal').classList.remove('show');
  const qroom = (qs.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const sess = LS.get('session', null);
  let h = '';
  if (errMsg && rejected) h += `<div class="err">${esc(errMsg)}</div>`;
  h += `<div class="card"><div class="lbl" style="margin-top:0">Dit navn</div><input type="text" id="name" maxlength="16" autocomplete="off" placeholder="Fx Emil" value="${esc(myName)}"></div>`;
  const join = `<div class="card"><h3 style="margin:0 0 4px">${qroom ? 'Deltag i spil' : 'Deltag i et spil'}</h3><div class="lbl">Spilkode</div><input type="text" id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE" value="${esc(qroom)}"><button class="primary" id="btnJoin" style="margin-top:12px" onclick="doJoin()">Deltag</button></div>`;

  if (sess && !qroom && !rejected) h += `<div class="card"><button class="ghost" style="width:100%" onclick="location.href='${esc(linkFor(sess.room))}'">↻ Genoptag spil ${esc(sess.room)}</button></div>`;
  h += qroom ? join + create : create + join;
  h += `<div class="card hint">Tip: Tryk på del-knappen i Safari/Chrome og vælg <b>“Føj til hjemmeskærm”</b>, så ligger spillet som en app.<br>Alle spillere skal have internet. Telefonerne forbindes direkte med hinanden.</div>`;

function getName() { const n = ($('name').value || '').trim().slice(0, 16); if (!n) { toast('Skriv dit navn først'); $('name').focus(); return null; } LS.set('name', n); return n; }
function doCreate() { const n = getName(); if (!n) return; const t = parseInt($('tgt').value, 10) || 200; errMsg = ''; rejected = false; hostCreate(n, Math.max(10, t)); }
function doJoin() { const n = getName(); if (!n) return; const c = ($('code').value || '').toUpperCase().replace(/[^A-Z0-9]/g, ''); if (c.length < 4) { toast('Skriv spilkoden'); return; } clientJoin(c, n); }

function renderLobby() {
  $('bottom').style.display = 'none'; $('modal').classList.remove('show');

function renderGame() {
  const v = view, meIdx = v.players.findIndex(p => p.id === myId), mp = v.players[meIdx];
  const myTurn = isMyTurn(v);
  // nye hændelser -> toast

  if (v.seq > lastSeq) { const fresh = v.log.filter(l => l.n > lastSeq); const imp = fresh.filter(l => l.kind === 'bust' || l.kind === 'flip7' || l.kind === 'action').pop() || fresh[fresh.length - 1]; if (imp && !fxBig) toast(imp.txt, imp.kind); lastSeq = v.seq; }
  if (myTurn && !wasMyTurn) { buzz([200, 100, 200]); beep(); keepAwake(); }

  // banner

    if (v.pending) {
      const ch = v.players[v.pending.chooser];
      if (v.pending.chooser === meIdx) { bannerCls = 'me'; bannerTxt = 'Din tur!'; sub = 'Vælg hvem der får ' + CARD_NAME[v.pending.card]; }

  else if (v.phase === 'over') bannerTxt = 'Spillet er slut';

  h += `<div class="sub">Runde ${v.round} · Spil til ${v.target} · Bunke: ${v.deckCount} kort</div>`;
  // værts-hjælp for offline spillere
  if (role === 'host' && v.phase === 'play') {
    const actor = v.pending ? v.pending.chooser : (v.stage === 'turns' ? v.turn : -1);
    const ap = actor >= 0 && v.players[actor];
    if (ap && !ap.online && ap.id !== myId) {
      h += `<div class="hostfix">⚠️ <b>${esc(ap.name)}</b> er offline. Vent på at telefonen kommer tilbage, eller spil for dem:`;
      if (v.pending) h += `<button class="ghost" onclick="hostActFor('${esc(ap.id)}',{a:'choose',target:${v.pending.options[0]}})">Giv ${CARD_NAME[v.pending.card]} til ${esc(v.players[v.pending.options[0]].name)}</button>`;
      else { if (G.canStop(ap)) h += `<button class="ghost" onclick="hostActFor('${esc(ap.id)}',{a:'stop'})">Stop for ${esc(ap.name)}</button>`; h += `<button class="ghost" onclick="hostActFor('${esc(ap.id)}',{a:'draw'})">Træk for ${esc(ap.name)}</button>`; }
      h += '</div>';
    }
  }
  if (errMsg && role === 'host') h += `<div class="err">${esc(errMsg)}</div>`;
  // mine kort
  if (mp) {
    const hd = handHtml(mp, true);
    const pts = G.roundScore(mp);
    h += `<div class="card mine ${myTurn ? 'turn' : ''} ${v.phase === 'play' ? 'is-' + mp.status : ''}" id="mine"><div class="mhead"><div><div class="lbl" style="margin:0 0 4px">Dine kort · ${esc(mp.name)}</div>${statusChip(mp)}${mp.sc ? ' <span class="status st-stopped">♥ 2. chance</span>' : ''}</div><div class="pts" id="mypts">${pts}<small> point</small></div></div>`;
    h += `<div class="hand">${hd.nums.join('') || '<span class="hint">Ingen talkort endnu</span>'}</div>${hd.other.length ? `<div class="row2">${hd.other.join('')}</div>` : ''}`;
    h += `<div class="hint" style="margin-top:8px">${new Set(mp.nums).size}/7 forskellige tal · Total: <b>${mp.total}</b></div></div>`;
  }

  const actor = v.phase === 'play' ? (v.pending ? v.pending.chooser : v.turn) : -1;
  h += '<div class="card"><div class="lbl" style="margin-top:0">Stilling (i turrækkefølge)</div>' + v.players.map((p, i) => {
    const rk = ranks.indexOf(p.total) + 1;
    return `<div class="pr ${i === actor ? 'cur' : ''} is-${p.status}" data-p="${i}"><div class="top"><span class="rank ${p.total === maxT && maxT > 0 ? 'lead' : ''}">${rk}</span><span class="nm">${i === actor ? '▶ ' : ''}${esc(p.name)}${p.id === myId ? '<small>(dig)</small>' : ''}${i === v.dealer ? '<small>giver</small>' : ''}${p.online ? '' : '<small style="color:#ff9aab">offline</small>'}</span>${statusChip(p)}<span class="rp">+${G.roundScore(p)}</span><span class="tot">${p.total}</span></div><div class="sm">${handHtml(p, false)}</div></div>`;
  }).join('') + '</div>';
  h += '<div class="card log"><div class="lbl" style="margin-top:0">Seneste</div>' + v.log.slice(-8).reverse().map(l => `<div class="${l.kind}">${esc(l.txt)}</div>`).join('') + '</div>';
  h += `<button class="ghost" style="width:100%;margin-bottom:10px" onclick="leave()">${role === 'host' ? 'Afslut spil' : 'Forlad spil'}</button>`;
  $('app').innerHTML = h;

  b.innerHTML = `<button class="stop" id="btnStop" ${canAct && G.canStop(mp) ? '' : 'disabled'} onclick="hostAct({a:'stop'})">Stop</button><button class="draw" id="btnDraw" ${canAct ? '' : 'disabled'} onclick="hostAct({a:'draw'})">Træk kort</button>`;
  // modal: målvalg / rundeslut / spilslut
  const m = $('modal'), sh = $('sheet');
  if (v.phase === 'play' && v.pending && v.pending.chooser === meIdx) {
    const P = v.pending;
    sh.innerHTML = `<h2>Du trak ${cardHtml(P.card).replace('class="c', 'class="c" style="width:34px;height:46px;font-size:18px;vertical-align:middle').replace(/<i>.*<\/i>/, '')} ${CARD_NAME[P.card]}</h2><p class="hint">${CARD_DESC[P.card]} Vælg en spiller:</p><div class="pick" id="pick">` +
      P.options.map(i => `<button data-t="${i}" ${sending ? 'disabled' : ''} onclick="hostAct({a:'choose',target:${i}})"><span>${esc(v.players[i].name)}${i === meIdx ? ' (dig selv)' : ''}</span><b>${G.roundScore(v.players[i])} p</b></button>`).join('') + '</div>';
    m.classList.add('show');
  } else if (v.phase === 'roundEnd' || v.phase === 'over') {
    const order = v.players.map((p, i) => i).sort((a, b) => v.players[b].total - v.players[a].total);

    s += '<table id="summary"><tr><th>Spiller</th><th>Runde</th><th style="text-align:right">Point</th><th style="text-align:right">Total</th></tr>' + order.map(i => { const p = v.players[i]; return `<tr><td><b>${esc(p.name)}</b><div class="sm">${handHtml(p, false)}</div></td><td>${statusChip(p)}</td><td class="n" style="color:${p.roundPts ? '#fff' : '#e0485f'}">+${p.roundPts}</td><td class="n" style="font-size:20px">${p.total}</td></tr>`; }).join('') + '</table>';
    if (role === 'host') s += v.phase === 'over' ? `<button class="primary" id="btnNew" onclick="hostNewGame()">Nyt spil</button>` : `<button class="primary" id="btnNext" style="height:60px;font-size:20px" onclick="hostNext()">Næste runde</button>`;
    else s += `<p class="hint" style="text-align:center">Venter på at ${esc(v.players[0].name)} ${v.phase === 'over' ? 'starter et nyt spil' : 'starter næste runde'}…</p>`;
    sh.innerHTML = s; m.classList.add('show');
  } else m.classList.remove('show');
}

// ---------- start ----------
(function boot() {
  const qroom = (qs.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const sess = LS.get('session', null);
  if (qroom && sess && sess.room === qroom && sess.role === 'host' && LS.get('host-' + qroom)) resumeHost(qroom);
  else if (qroom && sess && sess.room === qroom && sess.role === 'client' && myName) clientJoin(qroom, myName);
  else render();
})();
